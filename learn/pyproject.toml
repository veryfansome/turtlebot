[project]
name = "pet-learn"
version = "0.1.0"
description = "Learning to drive the TurtleBot 4: recorded sessions to training steps, policies, training"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "mcap",
    "mcap-ros2-support",
    "scipy>=1.18.1",
    "scikit-image>=0.26.0",
    "torch>=2.15.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pet_learn"]
